name: Verify SignalPilot
on: [push, pull_request]

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build, test and generate CycloneDX SBOM
        run: bash mvnw -B -Dbuild.commit="$GITHUB_SHA" verify
      - name: Record artifact checksum
        run: sha256sum target/signalpilot-1.0.0.jar > target/SHA256SUMS
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - name: Install and audit verification dependencies
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
          npx playwright install --with-deps chromium
      - name: Scan source, dependencies, configuration and secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: 1
          ignore-unfixed: true
      - name: Build immutable container candidate
        run: docker build --build-arg GIT_COMMIT="$GITHUB_SHA" --tag "signalpilot:${GITHUB_SHA}" .
      - name: Scan container candidate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: signalpilot:${{ github.sha }}
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: 1
          ignore-unfixed: true
      - name: Start application and verify revision, artifact and independent MCP client
        shell: bash
        run: |
          java -jar target/signalpilot-1.0.0.jar > target/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8091/actuator/health; then break; fi
            sleep 1
          done
          info=$(curl -fsS http://127.0.0.1:8091/actuator/info)
          test "$(jq -r '.git.commit.id.full' <<<"$info")" = "$(git rev-parse HEAD)"
          test "$(jq -r '.build.commit' <<<"$info")" = "$(git rev-parse HEAD)"
          test "$(jq -r '.artifact.sha256' <<<"$info")" = "$(cut -d' ' -f1 target/SHA256SUMS)"
          npm run test:mcp
          npm run test:a11y
      - name: Attest release artifact provenance
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: target/signalpilot-1.0.0.jar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: verification-evidence
          path: |
            target/surefire-reports/
            target/classes/META-INF/sbom/application.cdx.json
            target/SHA256SUMS
            target/accessibility-verification.json
            artifacts/mcp-verification.json
            target/server.log
